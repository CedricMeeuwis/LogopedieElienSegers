<main class="main">

          <logopedie-logo></logopedie-logo>
          <span class="sig-font">Elien Segers</span>
        </div>
      </div>
      <a class="d-none d-lg-block link-underline link-underline-opacity-0 text-dark me-lg-4" href="mailto:logopedie.eliensegers@gmail.com">logopedie.eliensegers@gmail.com</a>

      </div>
    </div>
    <div class="d-none d-md-flex flex-row justify-content-evenly alignt-items-center bg-info py-3">
